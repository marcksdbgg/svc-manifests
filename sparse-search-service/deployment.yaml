# sparse-search-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparse-search-service
  namespace: atenex
  labels:
    app: sparse-search-service
    app.kubernetes.io/name: sparse-search-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: atenex-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparse-search-service
  template:
    metadata:
      labels:
        app: sparse-search-service
        app.kubernetes.io/name: sparse-search-service
        app.kubernetes.io/version: "1.0.0"
    spec:
      # serviceAccountName: sparse-search-runtime-sa # Alternativa si usas Workload Identity
      containers:
        - name: sparse-search-service-container
          image: ghcr.io/marcksdbgg/sparse-search-service:main-1006081 # Reemplaza con tu imagen
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sparse-search-service-config
            - secretRef:
                name: sparse-search-service-secrets # Para SPARSE_POSTGRES_PASSWORD
          env:
            - name: SPARSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparse-search-service-secrets
                  key: SPARSE_POSTGRES_PASSWORD
            - name: SPARSE_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sparse-search-service-secrets
                  key: SPARSE_MINIO_ACCESS_KEY
            - name: SPARSE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sparse-search-service-secrets
                  key: SPARSE_MINIO_SECRET_KEY
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
