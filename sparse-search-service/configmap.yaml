apiVersion: v1
kind: ConfigMap
metadata:
  name: sparse-search-service-config
  namespace: atenex
  labels:
    app.kubernetes.io/name: sparse-search-service
    app.kubernetes.io/part-of: atenex-platform
data:
  SPARSE_LOG_LEVEL: "INFO"
  PORT: "8004"
  SPARSE_SERVICE_VERSION: "1.0.0"

  # Database Config
  SPARSE_POSTGRES_SERVER: "postgresql-service.atenex.svc.cluster.local"
  SPARSE_POSTGRES_PORT: "5432"
  SPARSE_POSTGRES_DB: "atenex"
  SPARSE_POSTGRES_USER: "postgres"
  SPARSE_DB_POOL_MIN_SIZE: "2"
  SPARSE_DB_POOL_MAX_SIZE: "10"
  SPARSE_DB_CONNECT_TIMEOUT: "30"
  SPARSE_DB_COMMAND_TIMEOUT: "60"

  # MinIO object storage settings (Alineados con config.py)
  # config.py field: INDEX_STORAGE_BUCKET_NAME -> Env: SPARSE_INDEX_STORAGE_BUCKET_NAME
  SPARSE_INDEX_STORAGE_BUCKET_NAME: "atenex-sparse-indices"
  
  # config.py field: INDEX_STORAGE_ENDPOINT -> Env: SPARSE_INDEX_STORAGE_ENDPOINT
  # Antes era SPARSE_MINIO_ENDPOINT (Incorrecto)
  SPARSE_INDEX_STORAGE_ENDPOINT: "minio.minio.svc.cluster.local:9000"
  
  # config.py field: INDEX_STORAGE_REGION -> Env: SPARSE_INDEX_STORAGE_REGION
  SPARSE_INDEX_STORAGE_REGION: "us-east-1"
  
  # config.py field: INDEX_STORAGE_SECURE -> Env: SPARSE_INDEX_STORAGE_SECURE
  SPARSE_INDEX_STORAGE_SECURE: "false"

  SPARSE_INDEX_CACHE_MAX_ITEMS: "50"
  SPARSE_INDEX_CACHE_TTL_SECONDS: "3600"